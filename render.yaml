services:
  - type: web
    name: rescuegrid-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PC_SDK_SUBSCRIPTION_KEY
        sync: false
      - key: OHSOME_API_KEY
        sync: false
